services:
  web:
    build: .
    ports:
      - "127.0.0.1:${FITZONE_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: fitness_center
      DB_USER: fitzone
      DB_PASS: ${FITZONE_DB_PASSWORD:-fitzone-local-dev}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: fitness_center
      MARIADB_USER: fitzone
      MARIADB_PASSWORD: ${FITZONE_DB_PASSWORD:-fitzone-local-dev}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
