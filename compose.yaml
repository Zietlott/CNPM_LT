
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${FITZONE_PORT:-8080}:80"
    environment:
      APP_ENV: local
      PAYMENT_DEMO_ENABLED: "1"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: fitness_center
      DB_USER: fitzone
      DB_PASS: ${FITZONE_DB_PASSWORD:-fitzone-local-dev}

      # SMTP configuration for password reset emails
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: no-reply@fitzone.local
      SMTP_FROM_NAME: FitZone
      APP_URL: http://localhost:8080

    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: fitness_center
      MARIADB_USER: fitzone
      MARIADB_PASSWORD: ${FITZONE_DB_PASSWORD:-fitzone-local-dev}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Local email testing service
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  db_data:
